name: Verify AWS OIDC

on:
  push:
    branches: [main]

permissions:
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - run: aws sts get-caller-identity --query Arn --output text
