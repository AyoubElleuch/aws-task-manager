name: Deploy app

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-terraform-deploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - working-directory: backend
        run: |
          npm ci
          npm run build
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - working-directory: infra/app
        run: |
          terraform init
          terraform apply -auto-approve
          aws s3 sync ../../frontend/dist/ "s3://$(terraform output -raw frontend_bucket_name)" --delete
          aws cloudfront create-invalidation --distribution-id "$(terraform output -raw frontend_distribution_id)" --paths '/*'
